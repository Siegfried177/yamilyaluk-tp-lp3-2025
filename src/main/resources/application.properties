spring.application.name=lp32025

# H2 Configuration for a file-based database
spring.datasource.url=jdbc:h2:file:./db/testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# H2 Console (optional, but recommended)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Hibernate auto DDL (crear/actualizar tablas automáticamente)
spring.jpa.hibernate.ddl-auto=update

# Mostrar SQL en consola (opcional para depuración)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
